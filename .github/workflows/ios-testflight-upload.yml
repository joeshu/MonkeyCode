name: iOS Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select newest installed Xcode
        run: |
          XCODE=$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' | sort -V | tail -1)
          test -n "$XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          swift --version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install JavaScript dependencies
        working-directory: mobile
        run: npm ci
      - name: Generate native iOS project
        working-directory: mobile
        env:
          CI: "1"
          EXPO_NO_DOCTOR: "1"
        run: npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods dependencies
        working-directory: mobile/ios
        run: |
          for attempt in 1 2 3 4 5; do
            pod install && exit 0
            echo "pod install failed (attempt ${attempt}); backing off"
            sleep $((attempt * 20))
          done
          exit 1
      - name: Build unsigned iOS app
        working-directory: mobile
        run: |
          xcodebuild -workspace ios/MonkeyCode.xcworkspace -scheme MonkeyCode -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Package unsigned IPA
        working-directory: mobile
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -type d | head -1)
          test -n "$APP"
          rm -rf Payload MonkeyCode-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/MonkeyCode.app
          /usr/bin/zip -qry MonkeyCode-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: MonkeyCode-ios-unsigned
          path: mobile/MonkeyCode-unsigned.ipa
          if-no-files-found: error

name: Build iOS continue proxy

on:
  workflow_dispatch:
    inputs:
      branch:
        required: true
        default: private-no-captcha
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Build proxy
        working-directory: proxy
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: go mod download && go build -trimpath -ldflags='-s -w' -o ../ios-continue-proxy .
      - uses: actions/upload-artifact@v4
        with:
          name: ios-continue-proxy-linux-amd64
          path: ios-continue-proxy

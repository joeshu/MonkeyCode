name: Desktop Windows Remote-only Build

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Build version, for example v26081701"
        required: true
        default: "v26081701"

jobs:
  build:
    runs-on: windows-latest
    env:
      MC_REMOTE_ONLY: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build browser extension
        working-directory: browser-extension
        run: |
          npm ci
          npm run build
      - name: Checkout public plugins
        run: git submodule update --init plugins
      - name: Set release version
        working-directory: desktop
        run: python scripts/set_release_version.py "${{ inputs.release_version }}"
      - name: Build unsigned remote-only Windows installer
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@^2 build --config bundle.windows.remote.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: MonkeyCode-windows-remote-only-${{ inputs.release_version }}
          path: desktop/target/release/bundle/nsis/*.exe
          if-no-files-found: error
